; =============================================================================
; Pool de PHP-FPM — EncuestaLive (NO VERIFICADO: nunca ejecutado)
; =============================================================================
; Este fichero se copia como `zz-www.conf`, de modo que se carga DESPUÉS del
; `www.conf` que trae la imagen oficial y sus valores ganan.

[www]
user = encuesta
group = encuesta

listen = 0.0.0.0:9000
; El contenedor de nginx es el único que debe hablar con FPM. La red interna
; de Compose ya lo aísla del exterior (no se publica el puerto 9000 al host),
; y esta lista lo refuerza dentro de la propia red.
listen.allowed_clients = 127.0.0.1

; -----------------------------------------------------------------------------
; Dimensionado
; -----------------------------------------------------------------------------
; D-05/PA-01 fija 300 sesiones simultáneas como objetivo. El grueso de ese
; tráfico son peticiones cortísimas (heartbeat cada 20 s y sondeo de estado).
; `dynamic` con 8 hijos listos y techo de 32 cubre el objetivo con holgura en
; un servidor de 2 vCPU y 2 GB sin arriesgar el OOM killer: 32 × 256 MB es el
; peor caso teórico, que no se alcanza porque ninguna petición de esta
; aplicación se acerca al límite de memoria.
;
; NO VERIFICADO: estos números NO se han medido bajo carga. Son un punto de
; partida razonado, no un resultado de prueba. OPERATIONS.md §5 explica qué
; mirar para ajustarlos.
pm = dynamic
pm.max_children = 32
pm.start_servers = 8
pm.min_spare_servers = 4
pm.max_spare_servers = 12
pm.max_requests = 500

; -----------------------------------------------------------------------------
; Health check y diagnóstico
; -----------------------------------------------------------------------------
; `ping.path` es lo que consulta `docker/bin/health-fpm.sh` vía cgi-fcgi. Es
; una comprobación REAL del intérprete: si FPM aceptara conexiones pero no
; pudiera ejecutar nada, un simple `nc -z` daría verde y esto da rojo.
ping.path = /fpm-ping
ping.response = pong
pm.status_path = /fpm-status

; -----------------------------------------------------------------------------
; Registro
; -----------------------------------------------------------------------------
; A stderr para que `docker logs` y cualquier recolector lo vean. Nunca a un
; fichero dentro del contenedor: se perdería al recrearlo.
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null

; Una petición que tarde más de 20 s está rota. Volcar su traza al log permite
; saber dónde, sin necesidad de un depurador en producción.
request_slowlog_timeout = 20s
slowlog = /dev/stderr

; Mata la petición (no el worker) a los 55 s, por debajo del
; `fastcgi_read_timeout` de nginx (60 s), para que el error lo genere PHP y
; quede registrado, en lugar de un 504 mudo de nginx.
request_terminate_timeout = 55s

clear_env = no
