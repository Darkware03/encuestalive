; =============================================================================
; EncuestaLive — ajustes de PHP para contenedor (NO VERIFICADO: sin Docker aquí)
; =============================================================================

; F-11 del informe de seguridad: `X-Powered-By: PHP/8.4.23` divulga la versión
; exacta del intérprete. nginx también la oculta con `fastcgi_hide_header`,
; pero conviene apagarla en origen: la defensa en profundidad empieza por no
; emitir el dato.
expose_php = Off

; F-09: con `display_errors = On` un error 500 vuelca traza y fuente al
; navegador. La página de Ignition de Laravel además volcaría las variables de
; entorno, APP_KEY y el secreto de Reverb incluidos. Nunca en un contenedor
; destinado a servir tráfico.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Un formulario de encuesta no sube ficheros. Los CSV se generan y se
; descargan, no se reciben.
file_uploads = Off
upload_max_filesize = 2M
post_max_size = 8M

memory_limit = 256M
max_execution_time = 60

; La exportación CSV de una encuesta grande puede tardar; el resto de peticiones
; son de milisegundos.
max_input_time = 60
max_input_vars = 2000

date.timezone = UTC

; Sesiones: el proyecto usa `SESSION_DRIVER=file` de Laravel (D-11), no el
; manejador nativo de PHP. Estos valores existen solo para que ninguna
; biblioteca de terceros abra una sesión nativa con cookies laxas.
session.cookie_httponly = On
session.cookie_samesite = Lax
session.use_strict_mode = On

; Evita que PHP revele rutas internas en mensajes de error de `open_basedir`.
; No se fija `open_basedir`: con usuario sin privilegios y un contenedor de un
; solo propósito aporta poco y rompe `realpath` del autoloader de Composer.

; Reverb mantiene muchos descriptores abiertos; `StreamSelectLoop` topa en
; ~1024 (ARCHITECTURE.md R5). No se puede subir desde php.ini —es un límite del
; sistema (`ulimit -n`)—, se documenta en OPERATIONS.md.
