; =============================================================================
; OPcache — EncuestaLive (NO VERIFICADO: nunca ejecutado)
; =============================================================================
; El código dentro de la imagen es INMUTABLE: se hornea en el build y no
; cambia hasta el siguiente despliegue. Por eso `validate_timestamps=0`, que
; elimina un `stat()` por fichero y por petición.
;
; CONSECUENCIA OPERATIVA QUE HAY QUE TENER PRESENTE: con este ajuste, editar un
; .php dentro de un contenedor en marcha NO TIENE NINGÚN EFECTO. Un despliegue
; es siempre «imagen nueva + contenedor nuevo», jamás «editar y recargar».
; Está documentado en DEPLOYMENT.md §6.

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.revalidate_freq = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; JIT: desactivado a propósito. Esta aplicación está dominada por E/S (SQL y
; render de Blade), no por cálculo; el JIT de PHP apenas aporta en ese perfil y
; añade una superficie de fallo que nadie de este equipo va a saber depurar a
; las 3 de la madrugada. Activarlo solo con medición que lo justifique.
opcache.jit = disable
opcache.jit_buffer_size = 0
