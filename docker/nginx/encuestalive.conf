# =============================================================================
# EncuestaLive — nginx (NO VERIFICADO: nunca ejecutado, no hay Docker aquí)
# =============================================================================
# Validado únicamente con un analizador sintáctico propio (`nginx -t` NO se ha
# podido ejecutar: no hay binario de nginx en el host de la fábrica).
# =============================================================================

# -----------------------------------------------------------------------------
# $https_flag — "on" solo cuando la petición original venía por HTTPS.
# -----------------------------------------------------------------------------
# Este bloque `map` vive en contexto `http` (conf.d se incluye ahí), NO dentro
# de `server`. Si se mueve dentro del `server`, nginx no arranca.
#
# Se mira `X-Forwarded-Proto` y no `$scheme`, porque en el despliegue previsto
# el TLS lo termina un proxy/balanceador POR DELANTE de este nginx: aquí el
# esquema siempre sería `http` y la aplicación generaría URL inseguras.
# El valor vacío es intencionado: `fastcgi_param ... if_not_empty` hace que
# entonces no se envíe `HTTPS` en absoluto, que es lo que PHP espera.
map $http_x_forwarded_proto $https_flag {
    default    "";
    "https"    "on";
}

upstream encuestalive_php {
    server app:9000;
    keepalive 16;
}

upstream encuestalive_reverb {
    server reverb:8080;
    keepalive 32;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /var/www/html/public;
    index index.php;

    charset utf-8;

    # -------------------------------------------------------------------------
    # Cabeceras
    # -------------------------------------------------------------------------
    # OJO: las cabeceras de seguridad de la aplicación (CSP, X-Frame-Options,
    # Referrer-Policy, X-Content-Type-Options) las emite el middleware
    # `SecurityHeaders` de Laravel, también en las respuestas de error
    # (bootstrap/app.php, corrección de Fase 7b). NO se duplican aquí: dos
    # fuentes para la misma cabecera acaban divergiendo y es exactamente así
    # como se rompe una CSP.
    #
    # Lo que sí añade nginx es lo que la aplicación NO puede emitir por sí
    # misma de forma fiable: HSTS (F-11 del informe de seguridad), que solo
    # tiene sentido cuando hay TLS delante.
    #
    # ─── ACTIVAR SOLO CUANDO HAYA TLS ───────────────────────────────────────
    # Descomentar tras confirmar que el certificado funciona. Enviar HSTS por
    # HTTP plano no hace nada; enviarlo con un certificado roto deja el
    # dominio inaccesible durante `max-age` segundos. Empezar con max-age
    # corto (300) y subirlo cuando se confirme.
    #
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # F-11: no divulgar la versión del servidor.
    server_tokens off;

    # El QR y los CSV pueden crecer; el resto del tráfico es minúsculo.
    client_max_body_size 4m;
    client_body_timeout 30s;

    # -------------------------------------------------------------------------
    # Compresión
    # -------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json application/xml
        image/svg+xml;

    # -------------------------------------------------------------------------
    # WebSocket de Reverb
    # -------------------------------------------------------------------------
    # Laravel Echo abre `/app/{clave}` y la API HTTP de publicación usa
    # `/apps/{id}/...`. Se publican los dos a través de nginx para que el
    # contenedor de Reverb NO necesite puerto propio expuesto al exterior:
    # un servicio menos en el borde.
    #
    # `proxy_read_timeout 3600s` es deliberado. Una conexión WebSocket ociosa
    # es NORMAL: el dashboard puede pasar minutos sin recibir nada. Con el
    # valor por omisión (60 s) nginx cortaría el socket continuamente y el
    # dashboard viviría reconectando.
    location /app {
        proxy_pass http://encuestalive_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "Upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering off;
    }

    location /apps {
        proxy_pass http://encuestalive_reverb;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout  60s;
    }

    # -------------------------------------------------------------------------
    # Estáticos compilados por Vite
    # -------------------------------------------------------------------------
    # `public/build/assets/*` lleva hash en el nombre: es inmutable por
    # definición y se puede cachear un año sin riesgo.
    location /build/assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    location = /build/manifest.json {
        # El manifiesto NO es inmutable: es el índice que cambia en cada
        # despliegue. Cachearlo rompería la aplicación tras actualizar.
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; expires 7d; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # -------------------------------------------------------------------------
    # Nada de ficheros ocultos ni de fuentes
    # -------------------------------------------------------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # -------------------------------------------------------------------------
    # Laravel
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass encuestalive_php;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param DOCUMENT_ROOT   $document_root;

        # El proxy inverso debe decir la verdad sobre el esquema, o Laravel
        # generará URL `http://` detrás de un TLS terminado fuera y la CSP
        # `form-action 'self'` bloqueará el envío del formulario público.
        # (La nota de `.env.example` sobre APP_URL describe exactamente este
        # fallo: se ve la página rota y no hay ningún error en el servidor.)
        fastcgi_param HTTPS           $https_flag if_not_empty;
        fastcgi_param REQUEST_SCHEME  $scheme;

        fastcgi_hide_header X-Powered-By;   # F-11

        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;

        # Que Laravel renderice sus propias páginas de error, no nginx.
        fastcgi_intercept_errors off;
    }

    # Cualquier otro .php es un intento de ejecutar algo que no es el front
    # controller. No existe tal cosa en este proyecto.
    location ~ \.php$ {
        return 404;
    }

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
